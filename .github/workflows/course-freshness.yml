name: SkillSpring course freshness review

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: skillspring-course-freshness
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history for change detection
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check review dates, changed course files and official source links
        run: node scripts/check-course-freshness.mjs
      - name: Create or refresh a course review issue when needed
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('data/course-review-status.json', 'utf8'));
            const due = report.courses.filter(course => course.reviewDue);
            const changed = report.courses.filter(course => course.contentChanged);
            const unverified = report.courses.flatMap(course =>
              course.sourceChecks.filter(source => source.status === 'check_failed' || source.status === 'restricted')
                .map(source => ({ course: course.title, slug: course.slug, ...source }))
            );
            const title = '[Automated] SkillSpring course freshness review';
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const existing = open.data.find(issue => issue.title === title);
            if (!due.length && !changed.length && !unverified.length && !report.changeDetectionError) {
              if (existing) {
                core.info('No new review triggers. Existing review issue #' + existing.number + ' remains open until a human reviewer closes it.');
              } else {
                core.info('No changed course files, due reviews or unverified source URLs were found.');
              }
              return;
            }
            const lines = [
              'Automated review checkpoint: ' + report.generatedAt,
              'Trigger: ' + report.trigger,
              '',
              'This issue is a review reminder, not permission to overwrite course content automatically.',
              '',
              '## Course content files changed in this push',
              ...(changed.length ? changed.map(course => '- **' + course.title + '** (' + course.slug + ') — changed: ' + course.changedFiles.join(', ') + '.') : ['- None detected']),
              '',
              '## Courses due for scheduled review',
              ...(due.length ? due.map(course => '- **' + course.title + '** (' + course.slug + ') — last reviewed ' + course.lastReviewed + '; interval ' + course.reviewIntervalDays + ' days.') : ['- None']),
              '',
              '## Reference URLs needing manual verification',
              ...(unverified.length ? unverified.map(item => '- **' + item.course + '** (' + item.slug + ') — ' + item.url + ' — ' + (item.status === 'restricted' ? 'automated access restricted; verify manually' : (item.error || ('HTTP ' + item.httpStatus))) + '.') : ['- None']),
              '',
              '## Change detection',
              report.changeDetectionError
                ? '- Could not compare the push commits: ' + report.changeDetectionError
                : '- Compared the push before/after commits. Changed repository files: ' + (report.changedFiles.length ? report.changedFiles.join(', ') : 'none'),
              '',
              '## Reviewer checklist',
              '- Confirm current product behaviour and version-specific changes against official documentation.',
              '- Inspect the changed lesson files and update only the affected course material.',
              '- Verify explanations, code examples, exercises, expected outputs, screenshots and licensing/security notes.',
              '- Run the repository quality checks and relevant course exercises after edits.',
              '- Update lastReviewed in course-review-manifest.json only after the human review is complete.',
              '- Close this issue manually only after the reviewed changes and checks are committed.',
              '- Do not treat an inaccessible URL as proof that its content is outdated; verify manually.'
            ];
            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
              core.info('Updated existing review issue #' + existing.number);
            } else {
              const created = await github.rest.issues.create({ owner, repo, title, body });
              core.info('Created review issue #' + created.data.number);
            }
