name: Deploy SkillSpring to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["SkillSpring Field Radar refresh"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate site content and links
        run: node scripts/validate-site.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed pages and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for path in "" "start-here.html" "courses.html" "polyglot.html" "essential-course.html?course=logic" "python-practice.html" "python-practice.js" "python-practice.css" "powerbi-project.html" "powerbi-project.css" "field-radar.html" "field-radar-live.css" "data/field-radar.json" "data/powerbi-sales.csv" "data/powerbi-products.csv" "data/powerbi-regions.csv" "app.js" "courses.js" "essential-courses.js" "essential-course.js" "style.css" "course-engine.js"; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$base/$path" -o /dev/null
          done
          curl --fail --silent --show-error --location "$base/" -o /tmp/skillspring-home.html
          grep -qi "SkillSpring" /tmp/skillspring-home.html
          curl --fail --silent --show-error --location "$base/start-here.html" -o /tmp/skillspring-start.html
          grep -qi "Start from zero" /tmp/skillspring-start.html
          curl --fail --silent --show-error --location "$base/polyglot.html" -o /tmp/skillspring-lab.html
          grep -qi "Multi-language coding lab" /tmp/skillspring-lab.html
          curl --fail --silent --show-error --location "$base/field-radar.html" -o /tmp/skillspring-radar.html
          grep -qi "Latest headlines from the field" /tmp/skillspring-radar.html
          curl --fail --silent --show-error --location "$base/powerbi-project.html" -o /tmp/skillspring-powerbi.html
          grep -qi "Build a retail sales" /tmp/skillspring-powerbi.html
