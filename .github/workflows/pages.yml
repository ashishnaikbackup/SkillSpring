name: Deploy SkillSpring to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate site content and links
        run: node scripts/validate-site.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static website
        uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Smoke-test deployed pages and assets
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          for path in "" "start-here.html" "courses.html" "polyglot.html" "essential-course.html?course=logic" "app.js" "courses.js" "essential-courses.js" "essential-course.js" "style.css" "course-engine.js"; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 --retry-all-errors "$base/$path" -o /dev/null
          done
          curl --fail --silent --show-error --location "$base/" -o /tmp/skillspring-home.html
          grep -qi "SkillSpring" /tmp/skillspring-home.html
          curl --fail --silent --show-error --location "$base/start-here.html" | grep -qi "Start from zero"
          curl --fail --silent --show-error --location "$base/polyglot.html" | grep -qi "Multi-language coding lab"
